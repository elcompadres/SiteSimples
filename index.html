<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Compadres Airsoft & Tactical</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #444444;
            min-height: 100vh;
            position: relative;
        }

        /* MARCA D'ÁGUA — logo.png */
        body::before {
            content: "";
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: min(75%, 550px);
            height: min(75%, 550px);
            background: url("imagens/logo.png") no-repeat center;
            background-size: contain;
            opacity: 0.08;
            pointer-events: none;
            z-index: 1;
        }
    </style>
</head>

</html>

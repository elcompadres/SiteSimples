<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Compadres Airsoft & Tactical</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #444444;
            min-height: 100vh;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        /* MARCA D'ÁGUA — logo.png */
        body::before {
            content: "";
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: min(75%, 550px);
            height: min(75%, 550px);
            background: url("imagens/logo.png") no-repeat center;
            background-size: contain;
            opacity: 0.12;
            pointer-events: none;
            z-index: 1;
        }

        footer {
            margin-top: auto;
            padding: 25px 20px;
            text-align: center;
            color: #cccccc;
            position: relative;
            z-index: 2;
            font-size: 0.95rem;
            border-top: 1px solid #555555;
        }
    </style>
</head>
<body>

    <!-- Conteúdo virá aqui -->

    <footer>
        &copy; 2026 El Compadres Airsoft & Tactical — Todos os direitos reservados.
    </footer>

</body>
</html>

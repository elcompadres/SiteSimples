<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Compadres Airsoft & Tactical</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #444444;
            min-height: 100vh;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        /* MARCA D'ÁGUA — logo.png */
        body::before {
            content: "";
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: min(75%, 550px);
            height: min(75%, 550px);
            background: url("imagens/logo.png") no-repeat center;
            background-size: contain;
            opacity: 0.12;
            pointer-events: none;
            z-index: 1;
        }

        /* ===== CABEÇALHO ===== */
        header {
            background-color: #222222;
            padding: 15px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 15px;
            border-bottom: 3px solid #ffcc00;
            position: relative;
            z-index: 10;
        }

        /* LOGO */
        .logo {
            display: flex;
            align-items: center;
        }

        .logo img {
            height: 60px;
            width: auto;
            object-fit: contain;
        }

        /* BARRA DE BUSCA */
        .barra-busca {
            flex: 1;
            min-width: 280px;
            max-width: 500px;
            display: flex;
        }

        .barra-busca input {
            flex: 1;
            padding: 10px 15px;
            border: none;
            border-radius: 4px 0 0 4px;
            font-size: 0.95rem;
            outline: none;
        }

        .barra-busca button {
            padding: 10px 18px;
            background-color: #ffcc00;
            border: none;
            border-radius: 0 4px 4px 0;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .barra-busca button:hover {
            background-color: #e6b800;
        }

        /* ÁREA DE LOGIN / CADASTRO E CARRINHO */
        .acoes {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .conta {
            display: flex;
            flex-direction: column;
            color: #ffffff;
            font-size: 0.9rem;
        }

        .conta a {
            color: #ffcc00;
            text-decoration: none;
            font-weight: 600;
        }

        .conta a:hover {
            text-decoration: underline;
        }

        .carrinho {
            display: flex;
            align-items: center;
            gap: 8px;
            background-color: #ffcc00;
            color: #000000;
            padding: 10px 15px;
            border-radius: 4px;
            text-decoration: none;
            font-weight: bold;
            transition: background 0.2s;
        }

        .carrinho:hover {
            background-color: #e6b800;
        }

        .carrinho .contador {
            background-color: #000000;
            color: #ffcc00;
            font-size: 0.8rem;
            padding: 2px 7px;
            border-radius: 50%;
            font-weight: bold;
        }

        /* RODAPÉ */
        footer {
            margin-top: auto;
            padding: 25px 20px;
            text-align: center;
            color: #cccccc;
            position: relative;
            z-index: 2;
            font-size: 0.95rem;
            border-top: 1px solid #555555;
        }

        /* RESPONSIVIDADE */
        @media (max-width: 900px) {
            header {
                gap: 12px;
            }
            .barra-busca {
                order: 3;
                width: 100%;
                max-width: 100%;
            }
        }
    </style>
</head>
<body>

    <!-- ===== CABEÇALHO ===== -->
    <header>
        <!-- LOGO -->
        <a href="#" class="logo">
            <img src="imagens/logo.png" alt="El Compadres Airsoft & Tactical">
        </a>

        <!-- BARRA DE BUSCA -->
        <form class="barra-busca" action="#" method="get">
            <input type="text" name="busca" placeholder="Buscar produtos...">
            <button type="submit">🔍</button>
        </form>

        <!-- LOGIN / CADASTRO E CARRINHO -->
        <div class="acoes">
            <div class="conta">
                <span>Olá, visitante</span>
                <div>
                    <a href="#">Entrar</a> / <a href="#">Cadastrar</a>
                </div>
            </div>
            <a href="#" class="carrinho">
                🛒 Carrinho
                <span class="contador">0</span>
            </a>
        </div>
    </header>

    <!-- Conteúdo virá aqui -->

    <!-- ===== RODAPÉ ===== -->
    <footer>
        &copy; 2026 El Compadres Airsoft & Tactical — Todos os direitos reservados.
    </footer>

</body>
</html>
